syntax = "proto3";

package valetaxtest.partners.v1;

option csharp_namespace = "ValetaxTest.Partners.API.Grpc";

// Queries of the partner tree for other services.
service PartnersDirectory {
  // Returns the user, or NOT_FOUND when the user is not registered.
  rpc GetUser (GetUserRequest) returns (UserReply);

  // Returns the partners above the user ordered by level (1 = direct partner),
  // or NOT_FOUND when the user is not registered.
  rpc GetUpline (GetUplineRequest) returns (GetUplineReply);
}

message GetUserRequest {
  string user_id = 1;
}

message UserReply {
  string user_id = 1;
  optional string partner_id = 2;
}

message GetUplineRequest {
  string user_id = 1;
  int32 max_depth = 2;
}

message GetUplineReply {
  string user_id = 1;
  repeated UplinePartner partners = 2;
}

message UplinePartner {
  int32 level = 1;
  string user_id = 2;
}
